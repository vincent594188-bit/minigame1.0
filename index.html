function imgdraw(img,x,y,angle,type){//type(0:左右1:任意)
    if (type==0){
        if (angle==0){
            scr.drawImage(img,x-img.width/2-cameraX+600,y-img.height/2-cameraY+300);
        }
        else{
            scr.save();
            scr.scale(-1,1);
            scr.drawImage(img,-1*(x-cameraX+600)-img.width/2,y-img.height/2-cameraY+300);
            scr.restore();
        }
    }
    else{
        scr.save();
        scr.translate(x-cameraX+600,y-cameraY+300);
        scr.rotate(angle*Math.PI/180);
        scr.drawImage(img,-img.width/2,-img.height/2);
        scr.restore();
    }
    
}

function additem(id,quan,durper){
    var item_add_tem=[];
    var flg=false;
    if (durper==0){
        for (var i=1;i>-1;i--){
            for (var j=0;j<bag[i].length;j++){
                if (bag[i][j].Id){
                    if (bag[i][j].Id==id){
                        if (bag[i][j].MaxQuan-bag[i][j].Quan>=quan){
                            bag[i][j].Quan+=quan;
                            quan=0;
                            break;
                        }
                        else{
                            quan-=bag[i][j].MaxQuan-bag[i][j].Quan;
                            bag[i][j].Quan=bag[i][j].MaxQuan;
                        }
                    }
                }
            }
            if (quan==0){
                flg=true;
                break;
            }
        }
        if (flg==false){
            for (var i=1;i>-1;i--){
                for (var j=0;j<bag[i].length;j++){
                    if (!bag[i][j].Id){
                        bag[i][j]={Id:id};
                        if (id==5){bag[i][j].MaxQuan=10;}
                        else if (id==6){bag[i][j].MaxQuan=10;}
                        else if (id==10){bag[i][j].MaxQuan=10;}
                        bag[i][j].Quan=quan;

                        flg=true;
                        break;
                    }
                }
                if (flg){break;}
            }
        }
    }
    else{
        for (var i=1;i>-1;i--){
            for (var j=0;j<bag[i].length;j++){
                if (!bag[i][j].Id){

                    bag[i][j]={Id:id};
                    if (id==1){bag[i][j].MaxDur=50;}
                    else if (id==2){bag[i][j].MaxDur=50;}
                    else if (id==3){bag[i][j].MaxDur=100;}
                    else if (id==4){bag[i][j].MaxDur=100;}
                    else if (id==7){bag[i][j].MaxDur=500;}
                    else if (id==8){bag[i][j].MaxDur=500;}
                    else if (id==9){bag[i][j].MaxDur=5000;}
                    bag[i][j].Dur=bag[i][j].MaxDur*durper;

                    flg=true;
                    break;
                }
            }
            if (flg){break;}
        }
    }
    return flg;
}



function distance(i,j){
    return Math.pow(Math.pow(lives[i].X-lives[j].X,2)+Math.pow(lives[i].Y-lives[j].Y,2),0.5)
}

function movex(i,v){
    var blocktest=true;
    var blocktestX;
    for (var j=Math.floor((lives[i].X-lives[i].W+v)/50);j<=Math.floor((lives[i].X+lives[i].W+v)/50);j++){
        for (var k=Math.floor((lives[i].Y-lives[i].H)/50);k<=Math.floor((lives[i].Y+lives[i].H)/50);k++){
            if (j>=0 && k>=0 && j<spot[0].length && k<spot.length){
                if (spot[k][j]!=-1){
                    blocktest=false;
                    blocktestX=j;
                }
            }
        }
    }
    if (blocktest || lives[i].ThrW){
        lives[i].X+=v;
        return true;
    }
    else{
        if (v<0){
            lives[i].X=blocktestX*50+50+lives[i].W+0.1;
        }
        else{
            lives[i].X=blocktestX*50-lives[i].W-0.1;
        }
        return false;
    }
}
function movey(i,v){
    var blocktest=true;
    var blocktestY;
    for (var j=Math.floor((lives[i].X-lives[i].W)/50);j<=Math.floor((lives[i].X+lives[i].W)/50);j++){
        for (var k=Math.floor((lives[i].Y-lives[i].H+v)/50);k<=Math.floor((lives[i].Y+lives[i].H+v)/50);k++){
            if (j>=0 && k>=0 && j<spot[0].length && k<spot.length){
                if (spot[k][j]!=-1){
                    blocktest=false;
                    blocktestY=k;
                }
            }
        }
    }
    if (blocktest || lives[i].ThrW){
        lives[i].Y+=v;
        if (i==0 && player_jumptimes==0){
            player_jumptimes++;
            W_tem=false;
        }
        return true;
    }
    else{
        if (v<0){
            lives[i].Y=blocktestY*50+50+lives[i].H+0.1;
        }
        else{
            lives[i].Y=blocktestY*50-lives[i].H-0.1;
            if (i==0){
                player_jumptimes=0;
            }
        }
        return false;
    }
}

function hittest(A,B){
    if (Math.abs(A.X-B.X)<=A.W+B.W && Math.abs(A.Y-B.Y)<=A.H+B.H){return true;}
    else{return false;}
}

function damage(i,j,v,atkdflg){
    if (i!=0 || player_inv==0){
        if (lives[j].Atkli.includes(lives[i].Tag)==false){
            audioplay(lives[i].Hitsound);
            var dmgv=Math.floor((v-lives[i].Armor)*(1-lives[i].Armor*0.03));
            if (dmgv>0){
                lives[i].Hp-=dmgv;
                dmg.push({V:String(dmgv),X:lives[i].X+Math.random()*16-8,Y:lives[i].Y+Math.random()*16-8,G:-10});
            }
            else{
                dmg.push({V:'0',X:lives[i].X+Math.random()*16-8,Y:lives[i].Y+Math.random()*16-8,G:-10});
            }
            if (atkdflg){lives[j].Atkli.push(lives[i].Tag);}
            if (i==0){
                player_inv=30;
                for (var k=0;k<3;k++){
                    if (bag[2][k].Id && bag[2][k].MaxDur){
                        bag[2][k].Dur-=10;
                    }
                }
            }
        }
    }
}



function knockback(i,j,v){
    if ((i!=0 || player_inv==0) && lives[i].Boss==false && lives[i].NoKb==false){
        if (lives[j].Atkli.includes(lives[i].Tag)==false){
            if (v!=0){
                var X=lives[i].X-lives[j].X;
                var Y=lives[i].Y-lives[j].Y;
                var R=v/Math.pow(X*X+Y*Y,0.5);
                lives[i].F=R*X;
                lives[i].G=R*Y;
            }
        }
    }
}

function track(i,j,anglev){
    var dis=Infinity;
    if (j=='b' || j=='g'){
        var t = -1;
        for (var k=1;k<lives.length;k++){
            if (lives[k].Kind==j && lives[k].Bullet==false){
                var dis2 = distance(i,k)
                if (dis2<dis){
                    dis=dis2;
                    t=k;
                }
            }
        }
        if (t!=-1){
            var tangle=Math.atan2(lives[t].Y-lives[i].Y,lives[t].X-lives[i].X)*180/Math.PI;
            var CW=tangle-lives[i].Angle;
            var CCW=lives[i].Angle-tangle;
            while (CW<0){CW+=360;}
            while (CCW<0){CCW+=360;}
            if (CW<CCW){
                if (CW<anglev){lives[i].Angle=tangle;}
                else{lives[i].Angle+=anglev}
            }
            else{
                if (CCW<anglev){lives[i].Angle=tangle;}
                else{lives[i].Angle-=anglev}
            }
            
        }
    }
    else{
        var CW=lives[j].Angle-lives[i].Angle;
        var CCW=lives[i].Angle-lives[j].Angle;
        if (CW>CCW){lives[i].Angle+=anglev}
        else{lives[i].Angle-=anglev}
    }
}

function slimeAi(i,t,info){//Wcdl JumpF JumpG Cooltime
        if (lives[i].rans==0){
            if (lives[i].Gflg==false){
                if (lives[i].Wcd==0){
                    if (lives[t].X>lives[i].X){
                        lives[i].Angle=0;
                    }
                    else{
                        lives[i].Angle=180;
                    }
                    lives[i].Walk=true;
                }
                else if (lives[i].Wcd==info.Wcdl){
                    if(lives[i].Angle==0){
                        addF(i,info.JumpF,info.JumpF);
                    }
                    else{
                        addF(i,-info.JumpF,-info.JumpF);
                    }
                    addG(i,-info.JumpG,-info.JumpG);
                    lives[i].Walk=false;
                    lives[i].rans=Math.floor(5*Math.random())+info.Cooltime;
                }   
                lives[i].Wcd++;
            }
        }
        else{
            lives[i].Wcd=0;
            lives[i].rans--;
            if (lives[i].Gflg){
                if(lives[i].Angle==0){
                    addF(i,0.5,info.JumpF);
                }
                else{
                    addF(i,-0.5,-info.JumpF);
                }
            }
        }
    
   
}
function zombieAi(i,t,info){//Wcdl Speed 
    lives[i].rans=Math.floor(Math.random()*1.1);
        if (lives[i].rans==0){
            if (lives[i].Wcd%info.Wcdl==0){
                if (lives[t].X>lives[i].X){
                    lives[i].Angle=0;
                }
                else{
                    lives[i].Angle=180;
                }
                lives[i].Walk=true;
            }
            else{
                if (lives[i].Angle==0){
                    addF(i,0.4+(info.Speed)*0.05,info.Speed);
                }
                else{
                    addF(i,-0.5-(info.Speed)*0.05,info.Speed*-1);
                }
            }

            lives[i].Wcd++;
        }
        else{
            lives[i].rans--;
        }
    
}
function flyAi(i,t){
    lives[i].rans=Math.floor(Math.random()*1.1);
        if (lives[i].rans==0){
    if ((Math.floor(lives[i].Wcd/180)%2)==0){
        var heighttest=lives[t].Y-200;
    }
    else{
        var heighttest=lives[t].Y;
    }
    if (lives[i].Y>heighttest){
        addG(i,-0.3,-4);
    }
    else{
        addG(i,0.3,4);
    }
    if (lives[t].X>lives[i].X){
        lives[i].Angle=0;
        addF(i,0.1,4);
    }
    else{
        lives[i].Angle=180;
        addF(i,-0.1,-4);
    }
    lives[i].Wcd++;
}
else{
    lives[i].rans--;
}

}
function fistAi(i,info){//Acdl Long
    lives[i].Acd++;
    if (lives[i].Acd<info.Acdl){
        lives[i].Y=lives[0].Y;
        if (lives[i].Angle==0){lives[i].X=lives[0].X+lives[i].Acd*info.Long;}
        else{lives[i].X=lives[0].X-lives[i].Acd*info.Long;}
    }
    else{
        lives[i].Hp=0;
    }
}
function angle_to_FG(i,speed){
    lives[i].F=Math.cos(lives[i].Angle*Math.PI/180)*speed;
    lives[i].G=Math.sin(lives[i].Angle*Math.PI/180)*speed;
}
function arrowAi(i,info){//Speed Antig Dmg Kb
    if (lives[i].Acd==0){
        lives[i].Acd++;
        angle_to_FG(i,info.Speed);
    }
    else{
        lives[i].G-=info.Antig;
        lives[i].Angle=Math.atan2(lives[i].G,lives[i].F)*180/Math.PI;
        lives[i].Acd++;
        if (lives[i].Fflg==false){
            lives[i].Hp--;
            lives[i].Fflg=true;
        }
        if (lives[i].Gflg==false){
            lives[i].Hp--;
            lives[i].Gflg=true;
        }
    }
    
}
function swordAi(i,info){//Acdl Long
    lives[i].Acd++;
    if (lives[i].Acd<info.Acdl){
        lives[i].Y=lives[0].Y;
        if (lives[i].Angle==0){lives[i].X=lives[0].X+info.Long;}
        else{lives[i].X=lives[0].X-info.Long;}
    }
    else{
        lives[i].Hp=0;
    }
    
}

function hitdmg(i,j,kbv,dmgv,dmgflg,aoe){
    var flg=false;
    if (j=='b' || j=='g'){
        for (var k=1;k<lives.length;k++){
            if (lives[k].Kind==j && lives[k].Bullet==false){
                if (hittest(lives[i],lives[k])){
                    knockback(k,i,kbv);
                    damage(k,i,dmgv,dmgflg);
                    flg=true;
                    if (aoe==false){break;}
                }
            }
        }
    }
    else{
        if (hittest(lives[j],lives[i])){
            knockback(j,i,kbv);
            damage(j,i,dmgv,dmgflg);
            flg=true;
        }
    }
    return flg;
}

            spawn('b',8,1775,1400,0,-1);
            
        }
        else if (stage==11){  
            spawn('b',10,1775,1500,0,-1);  
            spawn('b',1,775,1500,0,-1);  
        }
        else if (stage==12){
            spawn('b',11,1775,1500,0,-1);  
            spawn('b',2,775,1050,0,-1); 
            spawn('b',0,775,1500,0,-1); 
        }
        else if (stage==13){
            spawn('b',11,1775,1500,0,-1);  
            spawn('b',11,1875,1500,0,-1);  
            spawn('b',11,1975,1500,0,-1);  
            spawn('b',6,625,1500,0,-1);
            spawn('b',6,575,1500,0,-1);
        }
        else if (stage==14){
            spawn('b',11,1775,1500,0,-1);  
            spawn('b',11,1875,1500,0,-1);  
            spawn('b',11,1975,1500,0,-1);  
            spawn('b',6,625,1500,0,-1);
            spawn('b',6,575,1500,0,-1);
        }
        else if (stage==15){
            spawn('b',3,1775,1400,0,-1);
        }
    }

    //inventory

    










    //death
    for (var i=1;i<lives.length;i++){
        if (lives[i].Hp<=0){
            lives.splice(i,1);
            i--;
        }
    }








    //show
    scr.clearRect(0,0,scr_info.width,scr_info.height);
    cameraX=lives[0].X;
    cameraY=lives[0].Y;
    var blockX=Math.floor(cameraX/50);
    var blockY=Math.floor(cameraY/50);
    for (var i=blockX-13;i<=blockX+13;i++){
        for (var j=blockY-7;j<=blockY+7;j++){
            if (i>=0 && j>=0 && i<spot[0].length && j<spot.length){
                if (spot[j][i]!=-1){
                    scr.drawImage(img_dict[6][spot[j][i]][0],i*50-cameraX+600,j*50-cameraY+300);
                }
            }
            else{
                scr.drawImage(img_dict[6][0][0],i*50-cameraX+600,j*50-cameraY+300);
                //scr.fillStyle='#222222';
                //scr.fillRect(i*50-cameraX+600,j*50-cameraY+300,51,51);
            }
        }
    }


    imgdraw(img_dict[1][0][0],lives[0].X,lives[0].Y+5,lives[0].angle,0);
    imgdraw(img_dict[0][0][0],lives[0].X,lives[0].Y-20,lives[0].angle,0);
    if (lives[0].Walk){
        imgdraw(img_dict[2][0][(Math.floor(lives[0].Wcd/5))%4],lives[0].X,lives[0].Y+30,lives[0].angle,0);
    }
    else{
        imgdraw(img_dict[2][0][0],lives[0].X,lives[0].Y+30,lives[0].angle,0);
    }
    for (var i=1;i<lives.length;i++){
        var dictspot;
        var listspot;
        var actspot=0;
        var showcd=0;
        var showtype=0;
        if (lives[i].Kind=='b'){
            dictspot=5;
            listspot=2;
            if (lives[i].Id==0){
                showcd=lives[i].Wcd;
            }
            else if (lives[i].Id==1){
                showcd=lives[i].Wcd;
            }
            else if (lives[i].Id==2){
                showcd=lives[i].Wcd;
            }
            else if (lives[i].Id==3){
                if (lives[i].Atk){
                    showcd=lives[i].Acd;
                    if (lives[i].Akind==0){
                        actspot=1;
                    }
                    else{
                        actspot=2;
                    }
                }
                else{showcd=lives[i].Wcd;}
            }
            else if (lives[i].Id==4){
                showcd=lives[i].Acd;
            }
            else if (lives[i].Id==5){
                showtype=1;
            }
            else if (lives[i].Id==6){
                showcd=lives[i].Acd;
            }
            else if (lives[i].Id==7){
                showtype=1;
            }
            else if (lives[i].Id==8){
                showcd=lives[i].Wcd;
            }
            else if (lives[i].Id==9){
                showtype=1;
            }
            else if (lives[i].Id==10){
                showcd=lives[i].Wcd;
            }
            else if (lives[i].Id==11){
                showcd=lives[i].Wcd;
            }
        }
        if (lives[i].Kind=='g'){
            dictspot=4;
            listspot=1;
            if (lives[i].Id==0){
                showcd=lives[i].Acd;
            }
            else if (lives[i].Id==1){
                showcd=lives[i].Acd;
                showtype=1;
            }
            else if (lives[i].Id==2){
                showcd=lives[i].Acd;
            }
            else if (lives[i].Id==3){
                if (lives[i].Atk){
                    showcd=lives[i].Acd;
                    showtype=1;
                }
                else{
                    actspot=1;
                    showcd=0;
                }
            }
            else if (lives[i].Id==4){
                showtype=1;
            }
            else if (lives[i].Id==5){
                showcd=lives[i].Acd;
            }
            else if (lives[i].Id==6){
                showcd=lives[i].Acd;
            }

        }

        imgdraw(img_dict[dictspot][lives[i].Id][img_play[listspot][lives[i].Id][actspot][(Math.floor(showcd/5))%(img_play[listspot][lives[i].Id][actspot].length)]],lives[i].X,lives[i].Y,lives[i].Angle,showtype);
    }

    //(damage show)

    for (var i=0;i<dmg.length;i++){
        var dmgX=dmg[i].X-dmg[i].V.length*10;
        for (var j=0;j<dmg[i].V.length;j++){
            imgdraw(img_dict[7][0][Number(dmg[i].V[j])],dmgX,dmg[i].Y,0,0);
            dmgX+=20;
        }
        dmg[i].Y+=dmg[i].G;
        if (dmg[i].G>=0){dmg[i].G+=0.3;}
        else{dmg[i].G+=0.6;}

    }

    

    //(hitbox show)

    var hitbox = false;
    if (hitbox){
        scr.strokeStyle='#ff0000';
        scr.lineWidth=3;
        for (var i=0;i<lives.length;i++){
            scr.strokeRect(lives[i].X-lives[i].W-cameraX+600,lives[i].Y-lives[i].H-cameraY+300,lives[i].W*2,lives[i].H*2);
        }
    }

    
    
    //(player condition show)
    

    scr.fillStyle='#ff4444';
    scr.fillRect(60,535,200*(lives[0].Hp/lives[0].Maxhp),30);
    scr.drawImage(img_dict[7][1][10],10,520)
    var player_hp_str=String(lives[0].Hp);
    var player_hp_x=43-player_hp_str.length*7.5;

    for (var i=0;i<player_hp_str.length;i++){
        scr.drawImage(img_dict[7][1][Number(player_hp_str[i])],player_hp_x,526);
        player_hp_x+=15;
    }
    //boss hpbar show
    var bossone=-1;
    for (var i=1;i<lives.length;i++){
        if (lives[i].Boss){
            bossone=i;
        }
    }
    if (bossone!=-1){
        scr.fillStyle='#ff44ff';
        scr.fillRect(530,480,200*(lives[bossone].Hp/lives[bossone].Maxhp),30);
        scr.drawImage(img_dict[7][1][11],420,470);
        var boss_hp_str=String(lives[bossone].Hp);
        var boss_hp_x=485-boss_hp_str.length*7.5;

        for (var i=0;i<boss_hp_str.length;i++){
            scr.drawImage(img_dict[7][1][Number(boss_hp_str[i])],boss_hp_x,474);
            boss_hp_x+=15;
        }
    }

    //inventory
    var item_touched;
    bag_choose_type=-1;
    bag_choose_num=-1;
    mouse_touchUI=false
    if (craft_cd>0){craft_cd--;}

    if(bag_open){
        for (var i=0;i<Math.floor((bag[0].length-1)/5)+1;i++){
            for (var j=0;j<5;j++){
                var bag_num_tem=i*5+j;
                item_touched=false;
                if (bag_choose_num1==bag_num_tem && bag_choose_type1==0){scr.drawImage(img_dict[7][3][0],j*50,i*50+125);}
                else{itembgshow(j*50,i*50+125);}
                item_touched = itemshow(bag[0][bag_num_tem].Id,j*50,i*50+125);
                if (item_touched){
                    bag_choose_num=bag_num_tem;
                    bag_choose_type=0;
                    mouse_touchUI=true;
                }
                if (bag[0][bag_num_tem].MaxQuan){quanshow(bag[0][bag_num_tem].Quan,j*50,i*50+125);}
                if (bag[0][bag_num_tem].MaxDur){durbarshow(bag[0][bag_num_tem].Dur/bag[0][bag_num_tem].MaxDur,j*50,i*50+125);}
            }
        }
    }
    for (var i=0;i<5;i++){
        item_touched=false;
        if (bag_choose_num1==i && bag_choose_type1==1){scr.drawImage(img_dict[7][3][0],i*50+375,550);}
        else{itembgshow(i*50+375,550);}
        item_touched = itemshow(bag[1][i].Id,i*50+375,550);
        if (item_touched){
            bag_choose_num=i;
            bag_choose_type=1;
            mouse_touchUI=true;
        }
        if (tool_choose_num==i){scr.drawImage(img_dict[7][3][1],i*50+375,550)}
        if (bag[1][i].MaxQuan){quanshow(bag[1][i].Quan,i*50+375,550);}
        if (bag[1][i].MaxDur){durbarshow(bag[1][i].Dur/bag[1][i].MaxDur,i*50+375,550);}
    }
    for (var i=0;i<3;i++){
        item_touched=false;
        if (bag_choose_num1==i && bag_choose_type1==2){scr.drawImage(img_dict[7][3][0],i*50+650,550);}
        else{itembgshow(i*50+650,550);}
        item_touched = itemshow(bag[2][i].Id,i*50+650,550);
        if (item_touched){
            bag_choose_num=i;
            bag_choose_type=2;
            mouse_touchUI=true;
        }
        if (bag[2][i].MaxQuan){quanshow(bag[2][i].Quan,i*50+650,550);}
        if (bag[2][i].MaxDur){durbarshow(bag[2][i].Dur/bag[2][i].MaxDur,i*50+650,550);}
    }

    if(craft_open){
        scr.save();
        scr.globalAlpha=0.6;
        scr.drawImage(img_dict[7][3][3],800,100);
        scr.restore();
        for (var i=0;i<craft_list.length;i++){
            item_touched=false;
            if (craft_choose_num==i){scr.drawImage(img_dict[7][3][0],i*50+825,125);}
            else{itembgshow(i*50+825,125);}
            item_touched = itemshow(craft_list[i][0][0],i*50+825,125);
            if (item_touched && mouse){
                mouse_touchUI=true;
                bag_choose_phase=0;
                craft_choose_num=i;
                bag_choose_num1=-1;
                bag_choose_type1=-1;
            }
        }
    }
    if (craft_choose_num!=-1){
        for (var i=1;i<craft_list[craft_choose_num].length;i++){
            itembgshow(i*50+775,375);
            itemshow(craft_list[craft_choose_num][i][0],i*50+775,375);
            quanshow(craft_list[craft_choose_num][i][1],i*50+775,375);
        }
        scr.drawImage(img_dict[7][3][2],950,450);
        if (mouse_trueX>=950 && mouse_trueX<=1050 && mouse_trueY>=450 && mouse_trueY<=490 && mouse){
            mouse_touchUI=true;
            bag_choose_phase=0;
            bag_choose_num1=-1;
            bag_choose_type1=-1;
            if (craft_cd==0){
                //item detect
                var item_detect=[];
                var item_delete_tem=[];
                for (var i=1;i<craft_list[craft_choose_num].length;i++){
                    item_detect.push([craft_list[craft_choose_num][i][0],craft_list[craft_choose_num][i][1]]);
                }
                for (var h=1;h>-1;h--){
                    for (var i=0;i<bag[h].length;i++){
                        if (bag[h][i].Id){
                            for (var j=0;j<item_detect.length;j++){
                                if (bag[h][i].Id==item_detect[j][0]){
                                    if (item_detect[j][1]>=bag[h][i].Quan){
                                        item_detect[j][1]-=bag[h][i].Quan;
                                        item_delete_tem.push([h,i,bag[h][i].Quan]);
                                    }
                                    else{
                                        item_delete_tem.push([h,i,item_detect[j][1]]);
                                        item_detect[j][1]=0;
                                    }
                                }
                            }
                        }
                    }
                }
                var flg=true;
                for (var i=0;i<item_detect.length;i++){
                    if (item_detect[i][1]>0){flg=false;}
                }
                if (flg){
                    if (additem(craft_list[craft_choose_num][0][0],craft_list[craft_choose_num][0][1],1)){
                        for (var i=0;i<item_delete_tem.length;i++){
                            bag[item_delete_tem[i][0]][item_delete_tem[i][1]].Quan-=item_delete_tem[i][2]
                        }
                        craft_cd=20;
                        audioplay(8);
                    }
                }
            }
        }
    }


    if (mouse){
        if (bag_choose_phase==2){
            if(bag_choose_type1!=bag_choose_type || bag_choose_num1!=bag_choose_num){
                bag_choose_phase++;
            }
        }
        else if (bag_choose_phase==1){
            if (mouse_touchUI && bag[bag_choose_type][bag_choose_num].Id){
                bag_choose_type1=bag_choose_type;
                bag_choose_num1=bag_choose_num;
                bag_choose_phase++;
            }
            else{
                bag_choose_phase=0;
            }
        }
    }
    else if(bag_choose_phase==1 || (bag_choose_phase==4 && mouse && mouse_touchUI==false)){bag_choose_phase=0;}
    if(bag_choose_phase==4){
        if (mouse_touchUI){
            bag_choose_type2=bag_choose_type;
            bag_choose_num2=bag_choose_num;
            if (bag_choose_type1!=bag_choose_type2 || bag_choose_num1!=bag_choose_num2){
                if(bag[bag_choose_type2][bag_choose_num2].Id){
                    if (bag[bag_choose_type1][bag_choose_num1].Id==bag[bag_choose_type2][bag_choose_num2].Id && bag[bag_choose_type1][bag_choose_num1].MaxQuan){
                        if(bag[bag_choose_type1][bag_choose_num1].Quan+bag[bag_choose_type2][bag_choose_num2].Quan<=bag[bag_choose_type2][bag_choose_num2].MaxQuan){
                            bag[bag_choose_type2][bag_choose_num2].Quan+=bag[bag_choose_type1][bag_choose_num1].Quan;
                            bag[bag_choose_type1][bag_choose_num1].Quan=0;
                        }
                        else{
                            bag[bag_choose_type1][bag_choose_num1].Quan-=bag[bag_choose_type2][bag_choose_num2].MaxQuan-bag[bag_choose_type2][bag_choose_num2].Quan;
                            bag[bag_choose_type2][bag_choose_num2].Quan=bag[bag_choose_type2][bag_choose_num2].MaxQuan;
                        }
                    }
                    else{
                        var bag_item_tem=bag[bag_choose_type2][bag_choose_num2];
                        bag[bag_choose_type2][bag_choose_num2]=bag[bag_choose_type1][bag_choose_num1];
                        bag[bag_choose_type1][bag_choose_num1]=bag_item_tem;
                    }
                }
                else{
                    if (bag[bag_choose_type1][bag_choose_num1].Id){
                        bag[bag_choose_type2][bag_choose_num2]=bag[bag_choose_type1][bag_choose_num1];
                        bag[bag_choose_type1][bag_choose_num1]='n';
                    }
                }
                audioplay(7);
            }
        }
        bag_choose_phase=0;
        bag_choose_type1=-1;
        bag_choose_num1=-1;
    }
    
    //stage show
    scr.drawImage(img_dict[7][2][10],0,0);
    var stage_str=String(stage);
    var stage_x=120;
    for (var i=0;i<stage_str.length;i++){
        scr.drawImage(img_dict[7][2][Number(stage_str[i])],stage_x,0);
        stage_x+=15;
    }




    //player using tool
    if (mouse && lives[0].Acd==0 && lives[0].Stop==0 && mouse_touchUI==false && player_death==false){
        if (bag[1][tool_choose_num].Id){
            if (bag[1][tool_choose_num].Id==1){
                spawn('g',1,lives[0].X,lives[0].Y,mouseangle,lives[0].Tag);
                lives[0].Acd=20;
                bag[1][tool_choose_num].Dur--;
                audioplay(4);
            }
            else if (bag[1][tool_choose_num].Id==2){
                if (Math.abs(mouseangle)<=90){spawn('g',2,lives[0].X,lives[0].Y,0,lives[0].Tag);}
                else{spawn('g',2,lives[0].X,lives[0].Y,180,lives[0].Tag);}
                lives[0].Acd=35;
                bag[1][tool_choose_num].Dur--;
                audioplay(4);
            }
            else if (bag[1][tool_choose_num].Id==3){
                if (Math.abs(mouseangle)<=90){spawn('g',4,lives[0].X,lives[0].Y,0,lives[0].Tag);}
                else{spawn('g',4,lives[0].X,lives[0].Y,180,lives[0].Tag);}
                lives[0].Acd=20;
                bag[1][tool_choose_num].Dur--;
                audioplay(9);
            }
            else if (bag[1][tool_choose_num].Id==4){
                spawn('g',3,lives[0].X,lives[0].Y,mouseangle,lives[0].Tag);
                lives[0].Acd=35;
                bag[1][tool_choose_num].Dur--;
                audioplay(5);
            }
            else if (bag[1][tool_choose_num].Id==6){
                if (lives[0].Hp<lives[0].Maxhp && player_eatcd==0){
                    lives[0].Acd=20;
                    addHp(0,5);
                    bag[1][tool_choose_num].Quan--;
                    //player_eatcd=250;
                    audioplay(10);
                }
            }
            else if (bag[1][tool_choose_num].Id==7){
                if (Math.abs(mouseangle)<=90){spawn('g',6,lives[0].X,lives[0].Y,0,lives[0].Tag);}
                else{spawn('g',6,lives[0].X,lives[0].Y,180,lives[0].Tag);}
                lives[0].Acd=25;
                bag[1][tool_choose_num].Dur--;
                audioplay(4);
            }
            else if (bag[1][tool_choose_num].Id==10){
                if (lives[0].Hp<lives[0].Maxhp && player_eatcd==0){
                    lives[0].Acd=20;
                    addHp(0,20);
                    bag[1][tool_choose_num].Quan--;
                    player_eatcd=250;
                    audioplay(10);
                }
            }
        }
        else{
            if (Math.abs(mouseangle)<=90){spawn('g',0,lives[0].X,lives[0].Y,0,lives[0].Tag);}
            else{spawn('g',0,lives[0].X,lives[0].Y,180,lives[0].Tag);}
            lives[0].Acd=20;
            audioplay(9);
        }
    }
    if (lives[0].Acd>0 && lives[0].Stop==0){lives[0].Acd--;}

    lives[0].Armor=0;
    if (bag[2][1].Id){
        if (bag[2][1].Id==8){
            lives[0].Armor+=3;
        }
        else if (bag[2][1].Id==9){
            lives[0].Armor+=15;
        }
    }





    //inventory delete
    for (var i=0;i<bag.length;i++){
        for (var j=0;j<bag[i].length;j++){
            if (bag[i][j].MaxDur){
                if (bag[i][j].Dur<=0){
                    bag[i][j]='n';
                }
            }
            if (bag[i][j].MaxQuan){
                if (bag[i][j].Quan<=0){
                    bag[i][j]='n'
                }
            }
        }
    }


    //player death
    if (lives[0].Hp<=0){
        lives[0].Hp=0;
        player_life=false;
        player_death=true;


        clearInterval(game_update);
        scr.drawImage(death_img,0,0,1200,600);
        death_audio.play();
        
    }








}

function start(){
    if (loaded_img==total_img){
        var flg=true;
        for (var i=0;i<audio_dict.length;i++){
            if (audio_dict[i].readyState!=4){
                flg=false
            }
        }
        if (flg){
            game_update = setInterval(update,20);
            spot = [];
            for (var i=0;i<50;i++){
                var spot_tem=[];
                for (var j=0;j<50;j++){
                    spot_tem.push(0);
                }
                spot.push(spot_tem);
            }
            for (var i=10;i<41;i++){
                for (var j=20;j<31;j++){
                    spot[j][i]=-1;
                }
            }



            lives = []; 
            lives.push({Kind:'p',From:-1,Boss:false,NoKb:false,Id:0,X:1075,Y:1460,Angle:0,W:20,H:40,Hp:100,Maxhp:100,rans:0,Walk:false,Wcd:0,Atk:0,Acd:0,Acd1:0,F:0,Fflg:false,NoF:false,G:0,Gflg:false,NoG:false,Stop:0,Hitsound:6});
            
            //for (var i=0;i<50;i++){spawn('b',0,500,300,0);}
            //spawn('b',1,500,300,0);
            //spawn('b',2,500,300,0);
        
            
        



            clearInterval(game_start);
        }
    }

}
var game_update;
var game_start = setInterval(start,20);

</script>
